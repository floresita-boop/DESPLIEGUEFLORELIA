<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculos CodeRider</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .card {
            background: #1e293b;
            padding: 15px;
            margin-top: 15px;
            border-radius: 10px;
        }

        button {
            background: #22c55e;
            border: none;
            padding: 10px;
            margin-top: 10px;
            cursor: pointer;
            color: white;
            border-radius: 8px;
        }

        button:hover {
            background: #16a34a;
        }

        .resultado {
            margin-top: 10px;
            padding: 10px;
            background: #0b1220;
            border-radius: 8px;
        }

        .ok {
            color: #22c55e;
        }

        .fail {
            color: #ef4444;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Cálculos CodeRider</h1>

    <!-- ================= CALCULADORA ================= -->
    <div class="card">
        <h2>📊 Cálculos</h2>

        <input type="number" id="numero1" value="10">
        <input type="number" id="numero2" value="5">

        <select id="operacion">
            <option value="contador">Contador regresivo</option>
            <option value="sumaPar">Suma pares</option>
            <option value="impares">Impares</option>
            <option value="potencia">Potencia</option>
            <option value="secuencia">Fibonacci</option>
        </select>

        <input type="number" id="numeroInput" value="5">

        <button id="btncalcular">Calcular 🚀</button>

        <div id="resultados" class="resultado">
            El resultado aparecerá aquí...
        </div>
        <div id="zona-dinamica"></div>
    </div>

    <!-- ================= TESTING ================= -->
    <div class="card">
        <h2>🧪 Testing </h2>

        <button onclick="runAllTests()">Test General</button>
        <button onclick="runTest1()">Test 1</button>

        <div id="panel-tests" class="resultado">
            Aquí aparecerán los resultados...
        </div>
    </div>

</div>

<script type="module" src="./src/app.js"></script>
</body>
</html>
